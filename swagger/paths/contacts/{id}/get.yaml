tags:
  - Contacts
summary: Get contact by id
operationId: getContact
description: 'Retrieves contact details by the specified contact ID.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65caf65a087f10c88b598384'
responses:
  '200':
    description: Successfully found contact by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 65caf65a087f10c88b598384!
            data:
              $ref: '../../../components/schemas/contacts.yaml'
  '404':
    $ref: '../../../components/responses/404contactsId.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
