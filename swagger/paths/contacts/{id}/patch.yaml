tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update the contact with the specified ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65cart65o87f10c88b598395'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'Andrei Dumka'
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: '+3805574574577'
          email:
            type: string
            description: "Contact's email"
            example: 'andrei23415@mail.com'
          isFavourite:
            type: boolean
            description: 'Is favorite contact'
            example: true
          contactType:
            description: 'What type of contact does it belong to'
            enum: [work, home, personal]
            type: string
            example: 'home'
          photo:
            description: "Contact's photo"
            type: string
            example: 'https://res.cloudinary.com/dvgcgldeo/image/upload/v1749834846/photos/cykj7q14gasiokqcxqsv.jpg'
responses:
  '200':
    description: Successfully contact updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully contact updated with id 65ca67e7ae7f10c88b598384!
            data:
              type: object
              $ref: '../../../components/schemas/contacts.yaml'
  '404':
    $ref: '../../../components/responses/404contactsId.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
