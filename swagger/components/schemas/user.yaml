type: object
required:
  - name
  - email
properties:
  _id:
    description: "User's unique id"
    type: string
    format: uuid
    example: '6850639033bb206909fcc5ce'
  name:
    description: "User's name"
    type: string
    example: 'Anna'
  email:
    description: "User's email"
    type: string
    format: email
    example: 'anna21841@mail.com'
  createdAt:
    description: 'Timestamp when the user was created'
    type: string
    format: date-time
    example: '2023-12-01T21:42:10Z'
  updatedAt:
    description: 'Timestamp when the user was last updated'
    type: string
    format: date-time
    example: '2023-12-01T22:00:10Z'
